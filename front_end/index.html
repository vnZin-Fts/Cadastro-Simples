<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Formulário de Cadastro</title>
  <link rel="stylesheet" href="./css/main.css">
</head>

<body>

  <div class="form-container">
    <h2>Criar Conta</h2>
    <p>Preencha os campos abaixo para se cadastrar.</p>

    <form id="form-cadastro" action="#" method="POST">
      <!-- Campo Nome -->
      <div class="form-group">
        <label for="nome">Nome Completo</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
      </div>

      <!-- Campo E-mail -->
      <div class="form-group">
        <label for="email">E-mail</label>
        <input type="email" id="email" name="email" placeholder="exemplo@email.com" required>
      </div>

      <!-- Campo Senha -->
      <div class="form-group">
        <label for="senha">Senha</label>
        <input type="password" id="senha" name="senha" placeholder="No mínimo 8 caracteres" minlength="8" required>
      </div>

      <!-- Campo Termos de Uso -->
      <div class="form-checkbox">
        <input type="checkbox" id="termos" name="termos" required>
        <label for="termos">Eu aceito os <a href="#">Termos de Uso</a> e <a href="#">Políticas de Privacidade</a>.</label>
      </div>

      <!-- Botão de Envio -->
      <button type="submit" class="btn-submit">Cadastrar</button>
    </form>

    <div class="form-footer">
      <p>Já tem uma conta? <a href="#">Faça login</a></p>
    </div>
  </div>

  <!-- NOVO: Container para Exibir os Usuários Cadastrados -->
  <div class="exibicao-container">
    <h2>Usuários Cadastrados</h2>
    <p>Os clientes salvos aparecerão na lista abaixo:</p>

    <!-- É aqui dentro que o seu JavaScript vai injetar os itens da lista -->
    <ul id="lista-usuarios">
      <!-- Dica: Use o JavaScript para criar tags <li> aqui dentro -->
    </ul>
  </div>

</body>
<script src="script.js"></script>

</html>
